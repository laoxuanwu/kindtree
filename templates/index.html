<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>درخت مهربانی</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>


<main class="tree-container">


    <!-- =========================
         TREE
    ========================== -->

    <img
        src="{{ url_for('static', filename='images/tree.png') }}"
        class="tree-image"
        alt="درخت مهربانی"
    >


    <!-- =========================
         WELCOME TEXT
    ========================== -->

    <div class="welcome-text">

        <h1>
            درخت مهربانی
        </h1>

        <p>
           یه جمله از ته قلبت بهم بگو :) 
        </p>

    </div>


    <!-- =========================
         LEAVES
    ========================== -->

    <div id="leaves-container">

        <!--
            Existing leaves are created
            automatically by JavaScript.
        -->

    </div>


    <!-- =========================
         ADD LEAF
    ========================== -->

    <div
        id="add-leaf"
        class="add-leaf"
        title="افزودن جمله"
    >

        <img
            src="{{ url_for('static', filename='images/leaf.png') }}"
            alt="افزودن برگ"
        >

        <span>
            +
        </span>

    </div>

<a
    href="/admin"
    class="admin-button"
>
    مدیریت
</a>
</main>



<!-- =========================
     FORM
========================= -->

<div
    id="form-modal"
    class="modal"
>

    <div class="modal-content">

        <button
            id="close-form"
            class="close-button"
        >
            ×
        </button>


        <h2>
            یه برگ مهربانی بساز 
        </h2>


        <form id="kindness-form">


            <label for="name">
                نام
            </label>

            <input
                type="text"
                id="name"
                maxlength="100"
                required
                placeholder="نام شما"
            >


            <label for="major">
                رشته
            </label>

            <input
                type="text"
                id="major"
                maxlength="100"
                required
                placeholder="رشته تحصیلی شما"
            >


            <label for="sentence">
                جمله ای که بهم میخوای بگی
            </label>

            <textarea
                id="sentence"
                maxlength="300"
                required
                placeholder="یک جمله‌ی خوب برای دیگران بنویس..."
            ></textarea>


            <button
                type="submit"
                class="submit-button"
            >
                قرار دادن روی درخت 
            </button>


        </form>


        <p id="form-error"></p>

    </div>

</div>



<!-- =========================
     MESSAGE
========================= -->

<div
    id="message-modal"
    class="modal"
>

    <div class="modal-content message-content">

        <button
            id="close-message"
            class="close-button"
        >
            ×
        </button>


        <div id="message-text"></div>

    </div>

</div>



<script
    src="{{ url_for('static', filename='script.js') }}"
></script>


</body>

</html>
