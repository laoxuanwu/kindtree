<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>درخت مهربانی</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>


<body>

    <!-- =========================
         TREE
    ========================== -->

    <main class="tree-container">

        <img
            src="{{ url_for('static', filename='images/tree.png') }}"
            class="tree-image"
            alt="درخت مهربانی"
        >


        <!-- =========================
             LEAVES
        ========================== -->

        <div id="leaves-container">

            <!--
            Each leaf has a number.

            Later we can change the positions
            to perfectly match your actual tree.
            -->

            <div class="leaf" data-leaf="1" style="left: 15%; top: 20%;">
                <img src="{{ url_for('static', filename='images/leaf.png') }}">
                <span></span>
            </div>

                <span></span>
            </div>

                <img src="{{ url_for('static', filename='images/leaf.png') }}">
                <span></span>
            </div>

                <img src="{{ url_for('static', filename='images/leaf.png') }}">
                <span></span>
            </div>

                <img src="{{ url_for('static', filename='images/leaf.png') }}">

            </div>

                <img src="{{ url_for('static', filename='images/leaf.png') }}">
                <span></span>
            </div>

                <img src="{{ url_for('static', filename='images/leaf.png') }}">
                <span></span>
            </div>

            <div class="leaf" data-leaf="8" style="left: 20%; top: 32%;">
                <img src="{{ url_for('static', filename='images/leaf.png') }}">
                <span></span>
            </div>

            <div class="leaf" data-leaf="9" style="left: 32%; top: 35%;">
                <img src="{{ url_for('static', filename='images/leaf.png') }}">
                <span></span>
            </div>

            <div class="leaf" data-leaf="10" style="left: 47%; top: 31%;">
                <img src="{{ url_for('static', filename='images/leaf.png') }}">
                <span></span>
            </div>

            <div class="leaf" data-leaf="11" style="left: 60%; top: 34%;">
                <img src="{{ url_for('static', filename='images/leaf.png') }}">
                <span></span>
            </div>

            <div class="leaf" data-leaf="12" style="left: 73%; top: 33%;">
                <img src="{{ url_for('static', filename='images/leaf.png') }}">

            </div>

            <div class="leaf" data-leaf="13" style="left: 28%; top: 45%;">

            </div>

            <div class="leaf" data-leaf="14" style="left: 42%; top: 43%;">
                <img src="{{ url_for('static', filename='images/leaf.png') }}">

            </div>

            <div class="leaf" data-leaf="15" style="left: 56%; top: 45%;">
                <img src="{{ url_for('static', filename='images/leaf.png') }}">
                <span></span>
            </div>

            <div class="leaf" data-leaf="16" style="left: 70%; top: 44%;">
                <img src="{{ url_for('static', filename='images/leaf.png') }}">

                <span></span>
            </div>

            <div class="leaf" data-leaf="21" style="left: 80%; top: 51%;">
                <img src="{{ url_for('static', filename='images/leaf.png') }}">
                <span></span>
            </div>

        </div>


        <!-- =========================
             TITLE
        ========================== -->

        <div class="welcome-text">

            <h1>درخت مهربانی</h1>

            <p>
                یک جمله‌ی مهربانانه بنویس و آن را روی یکی از برگ‌ها قرار بده 🌿
            </p>

        </div>

    </main>


    <!-- =========================
         FORM MODAL
    ========================== -->

    <div id="form-modal" class="modal">

        <div class="modal-content">

            <button id="close-form"
                    class="close-button">
                ×
            </button>

            <h2>یک برگ مهربانی بساز 🌱</h2>

            <form id="kindness-form">

                <input
                    type="hidden"
                    id="leaf-number"
                >


                <label for="name">
                    نام
                </label>

                <input
                    type="text"
                    id="name"
                    maxlength="100"
                    required
                    placeholder="نام شما"
                >


                <label for="major">
                    رشته
                </label>

                <input
                    type="text"
                    id="major"
                    maxlength="100"
                    required
                    placeholder="رشته تحصیلی شما"
                >


                <label for="sentence">
                    جمله‌ی مهربانانه
                </label>

                <textarea
                    id="sentence"
                    maxlength="300"
                    required
                    placeholder="یک جمله‌ی خوب برای دیگران بنویس..."
                ></textarea>


                <button
                    type="submit"
                    class="submit-button">
                    قرار دادن روی درخت 🌿
                </button>

            </form>

            <p id="form-error"></p>

        </div>

    </div>


    <!-- =========================
         MESSAGE MODAL
    ========================== -->

    <div id="message-modal" class="modal">

        <div class="modal-content message-content">

            <button id="close-message"
                    class="close-button">
                ×
            </button>

            <div id="message-text"></div>

        </div>

    </div>


    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
